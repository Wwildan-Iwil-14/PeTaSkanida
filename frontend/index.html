<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <link rel="icon" type="image/png" href="/logo-peta-skanida.png" />
    <script>
      // Terapkan tema sebelum React dirender agar tidak berkedip.
      (function () {
        try {
          var saved = localStorage.getItem('peta-skanida.theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <title>PeTa SKANIDA | Penerimaan Tamu Digital SMK 2 Kota Magelang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
